name: pin policy (consumers)

# Fail when a consumer's reusable pin points at a SHA whose surface differs
# from the latest tag.
#
# The pin policy in standards/ci is "bump only when the tag's surface
# differs from the current pin" — a tighter rule than "always-latest",
# which would burn the open-pull-requests-limit on no-op bumps. The policy
# was justified by a one-line tag log per repo, with the implicit promise
# that someone (a script, a CI job) would keep the log honest. The log is
# not maintained and the bytes are; this job is the question, not the
# ledger.
#
# What it does, on schedule and on every push to main: for every reusable
# pin a consumer has (extracted from every workflow file under
# .github/workflows/), compare the surface of that reusable at the pinned
# SHA against the surface at the latest released tag. A difference is a
# bump owed under the policy; the job fails with the diff so the reviewer
# knows Dependabot is the path (it opens the PR), not this guard (it
# reports the gap).
#
# Cross-repo reads (the consumer's .github/workflows files, plus the
# reusable surfaces at pinned and tag refs) work with the GITHUB_TOKEN
# because all five consumers and .github itself are public; an empirical
# test on the test/cross-repo-token branch confirmed HTTP 200 against
# repos/Glyndor/<consumer>/contents with the workflow's own token, see
# the commit log around PR #116.
#
# Not consumer-facing: this is the org-internal guard that keeps the
# reusables honest from the producer side. Consumers do not call it.

on:
  schedule:
    - cron: '23 6 * * *' # daily, 06:23 UTC, ten minutes after dependabot-freshness
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: pin-policy-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pin-policy:
    name: pin policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the pin policy check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/pin-policy.py
