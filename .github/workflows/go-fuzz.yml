name: Go fuzz (reusable)

# Scheduled fuzzing for Go modules: runs `go test -fuzz` against each declared
# target for a short, bounded time to surface parser panics and edge cases.
# Callers wire the schedule (e.g. weekly cron) and pass the target list in their
# own workflow.
#
# The corpus persists between runs, which is what makes short runs add up.
# `setup-go` restores GOCACHE — where Go keeps the fuzzing corpus — but on a
# cache hit it does not save it again, so every input a run discovered used to
# die with the runner and the next week re-explored the same ground from the
# seeds. Its key also derives from go.sum, which a dependency bump changes.
# The corpus therefore gets a key of its own below.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Go module
        type: string
        default: "."
      targets:
        description: >-
          JSON array of {"package","func"} objects to fuzz, e.g.
          [{"package":"./auth/email","func":"FuzzValidateAndNormalize"}]
        type: string
        required: true
      fuzztime:
        description: How long to fuzz each target (go test -fuzztime)
        type: string
        default: "60s"

permissions:
  contents: read

concurrency:
  group: go-fuzz-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: go test -fuzz (smoke)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # The corpus lives inside GOCACHE, so ask the toolchain where that is
      # rather than assuming the default path.
      - name: Locate the fuzz corpus
        id: corpus
        run: echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      # The key carries the run id, so it never hits and the cache is always
      # saved; restore-keys then pulls the most recent corpus for this target.
      # That is the rolling-cache shape, and it is what lets one target's
      # discoveries compound across weeks instead of resetting every run.
      - name: Restore and extend the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.path }}
          key: go-fuzz-corpus-${{ matrix.package }}-${{ matrix.func }}-${{ github.run_id }}
          restore-keys: |
            go-fuzz-corpus-${{ matrix.package }}-${{ matrix.func }}-

      - name: Fuzz ${{ matrix.func }} (${{ matrix.package }})
        env:
          FUNC: ${{ matrix.func }}
          PACKAGE: ${{ matrix.package }}
          FUZZTIME: ${{ inputs.fuzztime }}
        run: go test -run='^$' -fuzz="^${FUNC}\$" -fuzztime="$FUZZTIME" "$PACKAGE"

      # A crash is only useful if the input that caused it survives. `go test
      # -fuzz` writes it under <package>/testdata/fuzz/<Target>/ in the
      # workspace, and the runner is destroyed moments later — so without this
      # the find degrades into log text that somebody has to retype. With the
      # file in hand, dropping it into the repository's testdata turns the crash
      # into a permanent regression case.
      #
      # The name carries the job index because a func name is not unique across
      # packages (two modules can both declare FuzzValidateAndNormalize) and
      # artifact names must not collide.
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-${{ matrix.func }}-${{ strategy.job-index }}
          path: ${{ inputs.working-directory }}/**/testdata/fuzz/**
          # A build or vet failure also lands here and leaves no corpus entry;
          # that is not worth a second, confusing failure on top of the first.
          if-no-files-found: ignore
