name: CI

# Thin caller: this repository carries no product code, so the only CI it
# runs against itself is the new-reusable gate that catches no-op PRs
# (squash-merge hiding the second `-v2` landing as a commit with zero files
# changed). Proven on Glyndor/apt#89 and Glyndor/homebrew-tap#54 before the
# v1.14.0 tag of Glyndor/.github was cut. The reusable's emitted check name
# is `empty-diff / empty diff`; it is advisory here too, not required in any
# ruleset, until a few weeks of green across the four consumers confirms the
# name has stabilised.
#
# `pin-policy` runs the per-repo pin-policy reusable. The cross-repo form
# that read every consumer's workflows from here was retired in the same
# PR (it could not reach private consumers — run 31733343259, 2026-08-13,
# demonstrated the failure mode).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  empty-diff:
    if: github.event_name == 'pull_request'
    uses: Glyndor/.github/.github/workflows/empty-diff.yml@fadfbebc989a58a2292438fecbd5a616ffa0bdf3 # v1.15.0

  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@8517d94fde00466f59b95c5d1bd838e2ad24a8bf # v1.15.2

  # Lint and test the Python scripts that this repository ships. The
  # job name is `tests`; python-ci.yml's inner job name is `Lint & test`;
  # the emitted check name on PR runs is `tests / Lint & test`. Until
  # the emitted name has been observed from a real run that fired for
  # the right reason, this stays advisory, not required in any ruleset
  # (see standards/ci/index.md — "A gate that has never fired is not a
  # gate").
  #
  # `coverage-threshold: 0` keeps pytest-cov out of the gate. The script
  # has a hyphenated name (`pin-policy.py`) and cannot be imported as a
  # module, so `pytest --cov` would measure nothing useful without a
  # rename that breaks the four consumer repositories. The 90% gate is
  # a follow-up after the rename.
  tests:
    uses: Glyndor/.github/.github/workflows/python-ci.yml@fadfbebc989a58a2292438fecbd5a616ffa0bdf3 # v1.15.0
    with:
      coverage-threshold: 0

