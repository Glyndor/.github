name: CI

# Thin caller: this repository carries no product code, so the only CI it
# runs against itself is the new-reusable gate that catches no-op PRs
# (squash-merge hiding the second `-v2` landing as a commit with zero files
# changed). Proven on Glyndor/apt#89 and Glyndor/homebrew-tap#54 before the
# v1.14.0 tag of Glyndor/.github was cut. The reusable's emitted check name
# is `empty-diff / empty diff`; it is advisory here too, not required in any
# ruleset, until a few weeks of green across the four consumers confirms the
# name has stabilised.
#
# `pin-policy` runs the per-repo pin-policy reusable. The cross-repo form
# that read every consumer's workflows from here was retired in the same
# PR (it could not reach private consumers — run 31733343259, 2026-08-13,
# demonstrated the failure mode).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  empty-diff:
    if: github.event_name == 'pull_request'
    uses: Glyndor/.github/.github/workflows/empty-diff.yml@c958978687af37dc2d826a967d9c549589afb39f # v1.14.1

  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@baaf5ee60f1c797bc39a94621646e14cc8ba6ed5 # v1.15.0

