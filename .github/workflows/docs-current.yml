name: Docs current

# Self-CI for this repo: docs/reusables/ is generated from the workflows it
# documents, so the only thing worth checking is that what is committed still
# matches what the generator produces. Without this the pages rot exactly like
# the hand-written list they replaced — and the part that rots is the emitted
# check names, which is what a consumer needs to configure a ruleset without
# creating a check nothing emits.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-current:
    name: docs match the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the YAML parser
        env:
          PYYAML_VERSION: "6.0.3"
        run: pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"

      - name: Regenerate and compare
        run: |
          set -euo pipefail
          python3 scripts/render-reusable-docs.py
          # A diff here means a workflow changed without its page being
          # regenerated. The fix is to run the generator and commit the result,
          # never to edit the page by hand.
          if ! git diff --exit-code -- docs/reusables; then
            echo "::error::docs/reusables is stale — run scripts/render-reusable-docs.py and commit the result"
            exit 1
          fi
          # A new reusable with no page is the same failure wearing a different
          # hat: git diff says nothing about a file that was never added.
          if [ -n "$(git status --porcelain -- docs/reusables)" ]; then
            git status --porcelain -- docs/reusables
            echo "::error::docs/reusables gained or lost a page — run the generator and commit the result"
            exit 1
          fi
          echo "docs/reusables matches the workflows"
